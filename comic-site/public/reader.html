<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--SSR:head--><title>Reader - MangVault</title><meta name="robots" content="noindex, follow" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.svg" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#e53935" />

  <!-- Preconnect to CDN -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />

  <link rel="stylesheet" href="/css/style.css?v=17" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="reader-body">
  <!-- READER TOOLBAR -->
  <div class="reader-toolbar" id="readerToolbar">
    <div class="reader-toolbar-inner">
      <a href="<!--SSR:backHref-->" class="back-btn" id="backToComic"><i class="fa fa-arrow-left"></i> Back</a>
      <div class="reader-info">
        <span id="readerComicTitle" class="reader-comic-title"><!--SSR:comicTitle--></span>
        <span id="readerChapterTitle" class="reader-chapter-title"><!--SSR:chapterTitle--></span>
      </div>
      <div class="reader-nav"><!--SSR:topNav--></div>
    </div>
  </div>

  <!-- SEO HEADER â€” real crawlable text above the canvas-based reader -->
  <div class="reader-seo-head"><!--SSR:seoHead--></div>

  <!-- PAGES -->
  <div class="reader-container" id="readerContainer">
    <div class="reader-loading"><i class="fa fa-spinner fa-spin fa-3x"></i><p>Loading chapter...</p></div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="reader-bottom-nav" id="readerBottomNav"><!--SSR:bottomNav--></div>

  <!-- CHAPTER CONTEXT â€” comic summary + nearby chapters, crawlable internal links -->
  <div class="reader-context"><!--SSR:context--></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
  <script src="/js/reader.js?v=8"></script>
</body>
</html>
